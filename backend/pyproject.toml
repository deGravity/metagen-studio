[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metagen-studio"
version = "0.1.0"
description = "Browser-based interactive CAD studio + AI copilot for metaDSL programs."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "pydantic>=2.0",
    # Generic copilot machinery now lives in standalone packages (see
    # ../../docs/repository_architecture.md): dsl-copilot-core (engine +
    # providers + PDF) and dsl-eval-core (headless eval harness). The studio
    # ships Anthropic + OpenAI (incl. vLLM-compatible) providers by default,
    # and the eval extra so its benchmark CLI works.
    "dsl-copilot-core[anthropic,openai,eval]>=0.1.0",
    "dsl-eval-core>=0.1.0",
    "metagen-dsl>=0.1.0",
    "metagen-kernel>=0.1.0",
    "metagen-simulator>=0.1.0",
]

[project.optional-dependencies]
# Optional copilot capabilities, delegated to the dsl-copilot-core extras:
#   pdf    — PyMuPDF attachment preprocessing (copilot.pdf)
#   gemini — Google Gemini provider (copilot.provider: gemini)
pdf = ["dsl-copilot-core[pdf]>=0.1.0"]
gemini = ["dsl-copilot-core[gemini]>=0.1.0"]

[project.scripts]
# `conda install metagen-studio && metagen-studio` launches the packaged
# studio (single uvicorn process serving the bundled SPA + /api routes).
metagen-studio = "studio_backend.cli:main"

[tool.setuptools.packages.find]
include = ["studio_backend*"]

[tool.setuptools.package-data]
# The bundled frontend is staged here at conda-build time
# (see packaging/recipes/metagen-studio/build.sh in metagen-dev). It is
# not present in dev checkouts; FastAPI handles its absence gracefully.
"studio_backend" = ["_frontend_dist/**/*"]
