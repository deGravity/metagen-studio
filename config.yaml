# metagen-studio default configuration (checked in).
#
# Override precedence (lowest → highest):
#   1. this file (metagen-studio/config.yaml)
#   2. ~/.config/metagen.yaml
#   3. ~/.metagenconfig.yaml
#   4. environment variables (METAGEN_STUDIO_*, see studio_backend/config.py)
#
# Files are deep-merged; only the keys you set need to appear in an override.

sessions:
  enabled: true
  # Where session logs / state / blobs are stored. '~' is expanded.
  # Override on a given machine via ~/.config/metagen.yaml or
  # the METAGEN_STUDIO_SESSION_DIR env var.
  dir: ~/.metagen-studio/sessions

copilot:
  # Thinking. Claude 4.x uses ADAPTIVE thinking (the fixed budget_tokens API is
  # rejected by opus-4.7/4.8). When on we request display="summarized" so the
  # readable chain-of-thought streams to the UI. Thinking is adaptive: at
  # effort=high the model may skip it on easy turns; xhigh/max engage it more
  # reliably/deeply (xhigh is the opus-4.7 sweet spot). effort also bounds total
  # token spend, so max_tokens gives thinking room. Toggleable per request.
  thinking:
    enabled: true
    effort: high          # low | medium | high | xhigh | max
    max_tokens: 16000     # raised automatically when thinking is on
  # Out-of-band session auto-naming (small model summarizes the chat).
  autoname:
    enabled: true
    model: claude-haiku-4-5-20251001
    every_turns: 5
    idle_seconds: 60
