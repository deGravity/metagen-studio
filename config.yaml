# metagen-studio default configuration (checked in).
#
# Override precedence (lowest → highest):
#   1. this file (metagen-studio/config.yaml)
#   2. ~/.config/metagen.yaml
#   3. ~/.metagenconfig.yaml
#   4. environment variables (METAGEN_STUDIO_*, see studio_backend/config.py)
#
# Files are deep-merged; only the keys you set need to appear in an override.

sessions:
  enabled: true
  # Where session logs / state / blobs are stored. '~' is expanded.
  # Override on a given machine via ~/.config/metagen.yaml or
  # the METAGEN_STUDIO_SESSION_DIR env var.
  dir: ~/.metagen-studio/sessions

copilot:
  # Provider selection. Default reproduces the original Anthropic-only studio.
  # Per-request override via ChatRequest.provider; if both are unset the
  # provider is inferred from the model name (claude*->anthropic, gpt*/o[134]*
  # ->openai, gemini*->gemini).
  provider: anthropic
  providers:
    anthropic:
      key_env: METAGEN_ANTHROPIC_API_KEY
    openai:                       # OpenAI Responses API (GPT-5.x)
      key_env: METAGEN_OPENAI_KEY
    gemini:                       # Google Gemini (generateContent)
      key_env: METAGEN_GOOGLE_KEY
    vllm:                         # OpenAI-compatible Chat Completions (vLLM)
      # base_url: http://<vllm-host>:8000/v1
      key_env: METAGEN_VLLM_KEY   # often a dummy ("EMPTY") for local servers
      models:                     # per-model capability / reasoning profile
        # Qwen3.5/3.6 toggle reasoning (enable_thinking) and take images
        # natively; none of the open models accept PDF (use the P3 pipeline).
        qwen3.5:      { reasoning: toggle, native_images: true,  native_pdf: false }
        qwen3.6:      { reasoning: toggle, native_images: true,  native_pdf: false }
        gpt-oss-120b: { reasoning: effort, native_images: false, native_pdf: false }
  # Thinking. Claude 4.x uses ADAPTIVE thinking (the fixed budget_tokens API is
  # rejected by opus-4.7/4.8). When on we request display="summarized" so the
  # readable chain-of-thought streams to the UI. Thinking is adaptive: at
  # effort=high the model may skip it on easy turns; xhigh/max engage it more
  # reliably/deeply (xhigh is the opus-4.7 sweet spot). effort also bounds total
  # token spend, so max_tokens gives thinking room. Toggleable per request.
  thinking:
    enabled: true
    effort: high          # low | medium | high | xhigh | max
    max_tokens: 16000     # raised automatically when thinking is on
  # Out-of-band session auto-naming (small model summarizes the chat).
  autoname:
    enabled: true
    model: claude-haiku-4-5-20251001
    every_turns: 5
    idle_seconds: 60
  # PDF / attachment preprocessing. Inline PDFs are routed to what the target
  # model can consume: native-PDF models (Claude/GPT/Gemini) get the PDF as-is
  # (set force_backend: true to instead A/B our extraction); vision models get
  # page images (+text); text-only models get extracted markdown, never images.
  # Files-API uploads (Anthropic) bypass this pipeline and are unaffected.
  pdf:
    backend: pymupdf4llm   # pymupdf4llm | vision_ocr | marker | pdfmux | docling | mineru
    mode: both             # text_only | images | both (gated by model caps)
    force_backend: false   # true → extract even when the model takes PDF natively
    image_dpi: 150
    # max_pages: 50        # cap pages processed (omit = all)
    vision_ocr:            # used only when backend: vision_ocr
      provider: anthropic  # anthropic | openai (a vision-capable model)
      # model: claude-haiku-4-5-20251001
    # marker:  { endpoint: http://<gpu-host>:8xxx/ingest }  # remote GPU service
    # pdfmux:  { endpoint: http://<gpu-host>:8xxx/ingest }
